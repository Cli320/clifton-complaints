<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:13px}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
/* Header */
#header{background:#2d4a2d;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:3px solid #c9a84c}
#header h1{font-size:15px;font-weight:700;letter-spacing:.02em}
#header span{font-size:11px;opacity:.7}
#header-left{display:flex;align-items:center;gap:14px}
/* Tabs */
#tabs{display:flex;background:#fff;border-bottom:1px solid #e0ddd6;flex-shrink:0}
.tab{padding:10px 20px;font-size:12px;font-weight:600;cursor:pointer;color:#888;border-bottom:2px solid transparent}
.tab:hover{color:#1a3a5c}
.tab.active{color:#1a3a5c;border-bottom-color:#1a3a5c}
/* Content */
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow-y:auto;padding:16px 20px}
.view.active{display:block}
/* Dashboard cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:12px 14px}
.kpi-label{font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.kpi-val{font-size:26px;font-weight:700}
.kpi-sub{font-size:10px;color:#aaa;margin-top:2px}
.kpi-blue{color:#1a3a5c}
.kpi-green{color:#27500a}
.kpi-red{color:#791f1f}
.kpi-orange{color:#633806}
.section-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.chart-box{background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:14px}
.chart-box h4{font-size:11px;font-weight:700;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{font-size:11px;color:#555;width:80px;flex-shrink:0}
.bar-track{flex:1;height:8px;background:#f0ede6;border-radius:4px;overflow:hidden}
.bar-fill{height:8px;border-radius:4px;transition:width .3s}
.bar-count{font-size:11px;font-weight:700;color:#1a1a1a;width:20px;text-align:right}
/* Table */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-box{flex:1;min-width:160px;padding:7px 10px;border-radius:8px;border:1px solid #d0cdc6;background:#fff;font-size:12px;font-family:inherit}
select.filter{padding:7px 10px;border-radius:8px;border:1px solid #d0cdc6;background:#fff;font-size:12px;font-family:inherit;color:#1a1a1a}
.btn{padding:6px 14px;border-radius:8px;border:1px solid #d0cdc6;background:#fff;font-size:12px;cursor:pointer;color:#1a1a1a;font-weight:600}
.btn:hover{background:#f5f5f3}
.btn-primary{background:#1a3a5c;border-color:#1a3a5c;color:#fff}
.btn-primary:hover{background:#142e4a}
.btn-export{background:#eaf3de;border-color:#9fc97c;color:#27500a}
.tbl-wrap{background:#fff;border:1px solid #e8e5de;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:11px}
thead{background:#f5f5f3}
th{padding:8px 10px;text-align:left;font-weight:700;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e8e5de;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #f0ede6;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag-high{background:#fcebeb;color:#791f1f}
.tag-medium{background:#faeeda;color:#633806}
.tag-low{background:#eaf3de;color:#27500a}
.tag-critical{background:#2d0a0a;color:#ff9999}
.tag-pending{background:#faeeda;color:#633806}
.tag-inprog{background:#e6f1fb;color:#0c447c}
.tag-completed{background:#eaf3de;color:#27500a}
.tag-escalated{background:#fcebeb;color:#791f1f}
.tag-closed{background:#f0ede6;color:#666}
.tag-cat{background:#eeedfe;color:#3c3489}
.comp-id{font-size:10px;font-weight:700;color:#1a3a5c;font-family:monospace}
/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.fl{display:flex;flex-direction:column;gap:4px}
.fl.full{grid-column:1/-1}
.fl label{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.03em}
.fl input,.fl select,.fl textarea{padding:7px 10px;border-radius:8px;border:1px solid #d0cdc6;background:#fff;font-size:12px;font-family:inherit;color:#1a1a1a}
.fl textarea{resize:vertical;min-height:60px}
.form-section{background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:16px;margin-bottom:12px}
.form-section h3{font-size:11px;font-weight:700;color:#1a3a5c;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0ede6}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:420px;max-height:90vh;overflow-y:auto;border:1px solid #e8e5de}
.modal h3{font-size:14px;font-weight:700;margin-bottom:14px;color:#1a3a5c}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* Misc */
.empty{text-align:center;padding:40px;color:#aaa;font-size:12px}
.res-time{font-size:10px;color:#888}
.action-btns{display:flex;gap:4px}
.ib{width:24px;height:24px;border-radius:6px;border:1px solid #e0ddd6;background:transparent;cursor:pointer;font-size:11px;color:#aaa;display:flex;align-items:center;justify-content:center}
.ib:hover{background:#f5f5f3;color:#666}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#c33;color:#fff;font-size:10px;font-weight:700;margin-left:4px}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <div id="header-left">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" 
      onerror="this.style.display='none'"
      style="height:48px;width:auto;object-fit:contain;filter:brightness(0) invert(1)" alt="Clifton Logo"/>
    <div>
      <div style="font-size:11px;opacity:.7;letter-spacing:.08em;text-transform:uppercase">Clifton International Hotel</div>
      <h1>🏨 Complaint Registration System</h1>
    </div>
  </div>
  <div style="text-align:right">
    <div id="hdr-date" style="font-size:11px;opacity:.7"></div>
    <div style="font-size:10px;opacity:.5;margin-top:2px">Front Office Department</div>
  </div>
</div>
<div id="tabs">
  <div class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</div>
  <div class="tab" onclick="switchTab('log')">📋 Complaint Log <span id="open-badge" class="badge" style="display:none"></span></div>
  <div class="tab" onclick="switchTab('new')">➕ New Complaint</div>
</div>
<div id="content">
  <div class="view active" id="view-dashboard"></div>
  <div class="view" id="view-log"></div>
  <div class="view" id="view-new"></div>
</div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="edit-modal">
<div class="modal">
  <h3>Edit complaint</h3>
  <div class="form-grid" style="gap:10px">
    <div class="fl"><label>Action taken</label><textarea id="e-action" rows="2"></textarea></div>
    <div class="fl"><label>Completion time</label><input id="e-comptime" type="time"/></div>
    <div class="fl"><label>Guest feedback</label><select id="e-feedback"><option>Resolved</option><option>Partially Resolved</option><option>Not Resolved</option><option>Awaiting</option></select></div>
    <div class="fl"><label>Guest comments</label><textarea id="e-comments" rows="2"></textarea></div>
    <div class="fl"><label>Status</label><select id="e-status"><option>Pending</option><option>In Progress</option><option>Completed</option><option>Escalated</option><option>Closed</option></select></div>
    <div class="fl"><label>Remarks</label><input id="e-remarks" placeholder="e.g. Room changed..."/></div>
  </div>
  <div class="mf"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEdit()">Save changes</button></div>
</div>
</div>

<script>
const now=new Date();
document.getElementById('hdr-date').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function fmtDate(d){return d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}
function fmtTime(t){return t||'—'}
function resHrs(s,e){if(!s||!e)return null;const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);const diff=(eh*60+em)-(sh*60+sm);return diff>0?(diff/60).toFixed(2):null;}
function genID(){return 'CMP-'+String(complaints.length+1).padStart(4,'0');}
function todayStr(){return now.toISOString().slice(0,10);}
function nowTime(){return now.toTimeString().slice(0,5);}

let complaints=[
  {id:'CMP-0001',date:'2026-05-03',timeReceived:'10:30',guestName:'John Smith',roomNo:'1013',contact:'+971-5265354',category:'Maintenance',priority:'High',description:'AC is not working in room',assignedTo:'Gimesh',action:'Checked the AC outdoor unit',startTime:'10:30',compTime:'11:15',guestFeedback:'Not Resolved',guestComments:'Guest was unhappy',foStaff:'SoNa',supervisor:'Anas Mahaboob',remarks:'Room changed',status:'Completed'},
];
let editId=null,filterStatus='all',filterCat='all',searchQ='';

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',['dashboard','log','new'][i]===t);});
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+t).classList.add('active');
  if(t==='dashboard')renderDashboard();
  else if(t==='log')renderLog();
  else if(t==='new')renderNewForm();
}

/* ---- DASHBOARD ---- */
function renderDashboard(){
  const el=document.getElementById('view-dashboard');
  const total=complaints.length;
  const pending=complaints.filter(c=>c.status==='Pending').length;
  const inprog=complaints.filter(c=>c.status==='In Progress').length;
  const completed=complaints.filter(c=>c.status==='Completed'||c.status==='Closed').length;
  const escalated=complaints.filter(c=>c.status==='Escalated').length;
  const notRes=complaints.filter(c=>c.guestFeedback==='Not Resolved').length;
  const resRate=total?((completed/total)*100).toFixed(1):0;
  const times=complaints.filter(c=>c.startTime&&c.compTime).map(c=>resHrs(c.startTime,c.compTime)).filter(Boolean);
  const avgRes=times.length?(times.reduce((a,b)=>a+ +b,0)/times.length).toFixed(2):0;
  const cats=['Maintenance','Housekeeping','Front Office','F&B','Security','IT','Other'];
  const catColors={'Maintenance':'#185fa5','Housekeeping':'#1d9e75','Front Office':'#534ab7','F&B':'#993c1d','Security':'#856404','IT':'#0f6e56','Other':'#888'};
  const catCounts=cats.map(c=>complaints.filter(x=>x.category===c).length);
  const maxCat=Math.max(...catCounts,1);
  const statuses=['Pending','In Progress','Completed','Escalated','Closed'];
  const statColors={'Pending':'#ba7517','In Progress':'#185fa5','Completed':'#1d9e75','Escalated':'#a32d2d','Closed':'#888'};
  const statCounts=statuses.map(s=>complaints.filter(x=>x.status===s).length);
  const maxStat=Math.max(...statCounts,1);

  // Recent 5
  const recent=[...complaints].reverse().slice(0,5);

  el.innerHTML=`
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Total complaints</div><div class="kpi-val kpi-blue">${total}</div></div>
    <div class="kpi"><div class="kpi-label">Pending</div><div class="kpi-val kpi-orange">${pending}</div></div>
    <div class="kpi"><div class="kpi-label">In progress</div><div class="kpi-val" style="color:#185fa5">${inprog}</div></div>
    <div class="kpi"><div class="kpi-label">Completed</div><div class="kpi-val kpi-green">${completed}</div></div>
    <div class="kpi"><div class="kpi-label">Escalated</div><div class="kpi-val kpi-red">${escalated}</div></div>
    <div class="kpi"><div class="kpi-label">Avg resolution (hrs)</div><div class="kpi-val kpi-blue">${avgRes}</div></div>
    <div class="kpi"><div class="kpi-label">Not resolved</div><div class="kpi-val kpi-red">${notRes}</div></div>
    <div class="kpi"><div class="kpi-label">Resolution rate</div><div class="kpi-val kpi-green">${resRate}%</div></div>
  </div>
  <div class="chart-grid">
    <div class="chart-box"><h4>Complaints by category</h4>
      ${cats.map((c,i)=>`<div class="bar-row"><div class="bar-label">${c}</div><div class="bar-track"><div class="bar-fill" style="width:${(catCounts[i]/maxCat*100)}%;background:${catColors[c]}"></div></div><div class="bar-count">${catCounts[i]}</div></div>`).join('')}
    </div>
    <div class="chart-box"><h4>Complaints by status</h4>
      ${statuses.map((s,i)=>`<div class="bar-row"><div class="bar-label">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${(statCounts[i]/maxStat*100)}%;background:${statColors[s]}"></div></div><div class="bar-count">${statCounts[i]}</div></div>`).join('')}
    </div>
  </div>
  <div class="section-title">Recent complaints</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>Guest</th><th>Room</th><th>Category</th><th>Priority</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${recent.map(c=>`<tr>
      <td><span class="comp-id">${c.id}</span></td>
      <td>${c.guestName}</td>
      <td>${c.roomNo}</td>
      <td><span class="tag tag-cat">${c.category}</span></td>
      <td><span class="tag tag-${c.priority.toLowerCase()}">${c.priority}</span></td>
      <td><span class="tag ${stClass(c.status)}">${c.status}</span></td>
      <td>${fmtDate(c.date)}</td>
    </tr>`).join('')}${!recent.length?'<tr><td colspan="7" class="empty">No complaints yet</td></tr>':''}</tbody>
  </table></div>`;
}

/* ---- LOG ---- */
function renderLog(){
  const el=document.getElementById('view-log');
  let list=complaints.filter(c=>{
    const qs=searchQ.toLowerCase();
    const matchQ=!qs||(c.guestName.toLowerCase().includes(qs)||c.roomNo.includes(qs)||c.id.toLowerCase().includes(qs)||c.description.toLowerCase().includes(qs));
    const matchS=filterStatus==='all'||c.status===filterStatus;
    const matchC=filterCat==='all'||c.category===filterCat;
    return matchQ&&matchS&&matchC;
  });
  const openCt=complaints.filter(c=>c.status==='Pending'||c.status==='In Progress'||c.status==='Escalated').length;
  const badge=document.getElementById('open-badge');
  badge.style.display=openCt?'inline-flex':'none';
  badge.textContent=openCt;

  el.innerHTML=`<div class="toolbar">
    <input class="search-box" placeholder="Search by ID, guest, room, description..." oninput="searchQ=this.value;renderLog()" value="${searchQ}"/>
    <select class="filter" onchange="filterStatus=this.value;renderLog()">
      <option value="all">All statuses</option>
      <option value="Pending">Pending</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
      <option value="Escalated">Escalated</option>
      <option value="Closed">Closed</option>
    </select>
    <select class="filter" onchange="filterCat=this.value;renderLog()">
      <option value="all">All categories</option>
      ${['Maintenance','Housekeeping','Front Office','F&B','Security','IT','Other'].map(c=>`<option value="${c}">${c}</option>`).join('')}
    </select>
    <button class="btn btn-export" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn btn-primary" onclick="switchTab('new')">➕ New complaint</button>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr>
      <th>ID</th><th>Date</th><th>Time</th><th>Guest</th><th>Room</th><th>Contact</th>
      <th>Category</th><th>Priority</th><th>Description</th><th>Assigned</th>
      <th>Status</th><th>Res. (hrs)</th><th>Feedback</th><th>FO Staff</th><th>Supervisor</th><th>Actions</th>
    </tr></thead>
    <tbody>${list.map(c=>`<tr>
      <td><span class="comp-id">${c.id}</span></td>
      <td>${fmtDate(c.date)}</td>
      <td>${fmtTime(c.timeReceived)}</td>
      <td><strong>${c.guestName}</strong></td>
      <td>${c.roomNo}</td>
      <td style="font-size:10px;color:#888">${c.contact||'—'}</td>
      <td><span class="tag tag-cat">${c.category}</span></td>
      <td><span class="tag tag-${c.priority.toLowerCase()}">${c.priority}</span></td>
      <td style="max-width:160px;font-size:11px">${c.description}</td>
      <td>${c.assignedTo||'—'}</td>
      <td><span class="tag ${stClass(c.status)}">${c.status}</span></td>
      <td class="res-time">${resHrs(c.startTime,c.compTime)||'—'}</td>
      <td><span style="font-size:10px;color:${c.guestFeedback==='Resolved'?'#27500a':c.guestFeedback==='Not Resolved'?'#791f1f':'#633806'}">${c.guestFeedback||'—'}</span></td>
      <td style="font-size:10px">${c.foStaff||'—'}</td>
      <td style="font-size:10px">${c.supervisor||'—'}</td>
      <td><div class="action-btns">
        <button class="ib" title="Edit" onclick="openEdit('${c.id}')">✎</button>
        <button class="ib" title="Delete" onclick="deleteComp('${c.id}')">✕</button>
      </div></td>
    </tr>`).join('')}${!list.length?'<tr><td colspan="16" class="empty">No complaints found</td></tr>':''}</tbody>
  </table></div>`;
}

/* ---- NEW FORM ---- */
function renderNewForm(){
  const el=document.getElementById('view-new');
  el.innerHTML=`
  <div style="max-width:700px;margin:0 auto">
  <div class="form-section">
    <h3>Guest information</h3>
    <div class="form-grid cols3">
      <div class="fl"><label>Guest name *</label><input id="n-guest" placeholder="Full name..."/></div>
      <div class="fl"><label>Room number *</label><input id="n-room" placeholder="e.g. 1013"/></div>
      <div class="fl"><label>Contact number</label><input id="n-contact" placeholder="+971-..."/></div>
    </div>
  </div>
  <div class="form-section">
    <h3>Complaint details</h3>
    <div class="form-grid">
      <div class="fl"><label>Category *</label><select id="n-cat"><option value="">Select...</option>${['Maintenance','Housekeeping','Front Office','F&B','Security','IT','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="fl"><label>Priority *</label><select id="n-pri"><option value="">Select...</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div>
      <div class="fl"><label>Date</label><input id="n-date" type="date" value="${todayStr()}"/></div>
      <div class="fl"><label>Time received</label><input id="n-time" type="time" value="${nowTime()}"/></div>
      <div class="fl full"><label>Complaint description *</label><textarea id="n-desc" placeholder="Describe the complaint in detail..."></textarea></div>
    </div>
  </div>
  <div class="form-section">
    <h3>Assignment & action</h3>
    <div class="form-grid">
      <div class="fl"><label>Assigned to</label><input id="n-assigned" placeholder="Staff name..."/></div>
      <div class="fl"><label>FO staff handling</label><input id="n-fo" placeholder="Front office staff..."/></div>
      <div class="fl"><label>Supervisor</label><input id="n-sup" placeholder="Supervisor name..."/></div>
      <div class="fl"><label>Start time</label><input id="n-start" type="time" value="${nowTime()}"/></div>
      <div class="fl full"><label>Action taken</label><textarea id="n-action" placeholder="Describe action taken..."></textarea></div>
    </div>
  </div>
  <div class="form-section">
    <h3>Resolution</h3>
    <div class="form-grid">
      <div class="fl"><label>Completion time</label><input id="n-comp" type="time"/></div>
      <div class="fl"><label>Guest feedback</label><select id="n-feedback"><option value="">Select...</option><option>Resolved</option><option>Partially Resolved</option><option>Not Resolved</option><option>Awaiting</option></select></div>
      <div class="fl"><label>Status</label><select id="n-status"><option>Pending</option><option>In Progress</option><option>Completed</option><option>Escalated</option><option>Closed</option></select></div>
      <div class="fl"><label>Remarks</label><input id="n-remarks" placeholder="e.g. Room changed, refund issued..."/></div>
      <div class="fl full"><label>Guest comments</label><textarea id="n-comments" placeholder="Guest's direct feedback or comments..."></textarea></div>
    </div>
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:20px">
    <button class="btn" onclick="clearForm()">Clear form</button>
    <button class="btn btn-primary" onclick="submitComplaint()">Register complaint</button>
  </div>
  </div>`;
}

function submitComplaint(){
  const guest=document.getElementById('n-guest').value.trim();
  const room=document.getElementById('n-room').value.trim();
  const cat=document.getElementById('n-cat').value;
  const pri=document.getElementById('n-pri').value;
  const desc=document.getElementById('n-desc').value.trim();
  if(!guest||!room||!cat||!pri||!desc){alert('Please fill in all required fields (*)');return;}
  const c={
    id:genID(),
    date:document.getElementById('n-date').value,
    timeReceived:document.getElementById('n-time').value,
    guestName:guest,roomNo:room,
    contact:document.getElementById('n-contact').value,
    category:cat,priority:pri,description:desc,
    assignedTo:document.getElementById('n-assigned').value,
    foStaff:document.getElementById('n-fo').value,
    supervisor:document.getElementById('n-sup').value,
    startTime:document.getElementById('n-start').value,
    action:document.getElementById('n-action').value,
    compTime:document.getElementById('n-comp').value,
    guestFeedback:document.getElementById('n-feedback').value,
    guestComments:document.getElementById('n-comments').value,
    remarks:document.getElementById('n-remarks').value,
    status:document.getElementById('n-status').value,
  };
  complaints.push(c);
  alert('Complaint '+c.id+' registered successfully!');
  switchTab('log');
}

function clearForm(){renderNewForm();}

/* ---- EDIT ---- */
function openEdit(id){
  editId=id;
  const c=complaints.find(x=>x.id===id);
  if(!c)return;
  document.getElementById('e-action').value=c.action||'';
  document.getElementById('e-comptime').value=c.compTime||'';
  document.getElementById('e-feedback').value=c.guestFeedback||'Awaiting';
  document.getElementById('e-comments').value=c.guestComments||'';
  document.getElementById('e-status').value=c.status||'Pending';
  document.getElementById('e-remarks').value=c.remarks||'';
  document.getElementById('edit-modal').classList.add('open');
}
function saveEdit(){
  const c=complaints.find(x=>x.id===editId);
  if(!c)return;
  c.action=document.getElementById('e-action').value;
  c.compTime=document.getElementById('e-comptime').value;
  c.guestFeedback=document.getElementById('e-feedback').value;
  c.guestComments=document.getElementById('e-comments').value;
  c.status=document.getElementById('e-status').value;
  c.remarks=document.getElementById('e-remarks').value;
  closeModal();renderLog();
}
function deleteComp(id){if(confirm('Delete complaint '+id+'?')){complaints=complaints.filter(x=>x.id!==id);renderLog();}}
function closeModal(){document.getElementById('edit-modal').classList.remove('open');}
document.getElementById('edit-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

/* ---- EXPORT ---- */
function exportCSV(){
  const headers=['ID','Date','Time','Guest Name','Room No','Contact','Category','Priority','Description','Assigned To','Action Taken','Start Time','Completion Time','Resolution (hrs)','Guest Feedback','Guest Comments','FO Staff','Supervisor','Remarks','Status'];
  const rows=complaints.map(c=>[c.id,fmtDate(c.date),c.timeReceived,c.guestName,c.roomNo,c.contact,c.category,c.priority,'"'+c.description.replace(/"/g,'""')+'"',c.assignedTo,'"'+(c.action||'').replace(/"/g,'""')+'"',c.startTime,c.compTime,resHrs(c.startTime,c.compTime)||'',c.guestFeedback,'"'+(c.guestComments||'').replace(/"/g,'""')+'"',c.foStaff,c.supervisor,c.remarks,c.status]);
  const csv=[headers,...rows].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='complaint_log_'+todayStr()+'.csv';a.click();
}

function stClass(s){return{Pending:'tag-pending','In Progress':'tag-inprog',Completed:'tag-completed',Escalated:'tag-escalated',Closed:'tag-closed'}[s]||'tag-pending';}

renderDashboard();
</script>
